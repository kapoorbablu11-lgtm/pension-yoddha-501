<!DOCTYPE html>
<html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>पेंशन योद्धाओं की आवाज़ — किताब</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
body{font-family:'Noto Sans Devanagari',sans-serif;background:#162a5c;color:#faf4e3;margin:0}
header{text-align:center;padding:12px;background:#101f45;border-bottom:3px solid #d4a843}
h1{color:#d4a843;font-size:1.3rem;margin:0}
p.sub{font-size:.75rem;color:#cfd8ee;margin:4px 0 0}
#book{background:#0a1734;border:4px solid #d4a843;border-radius:10px;height:62vh;display:flex;align-items:center;justify-content:center;margin:10px;overflow:hidden}
#book canvas{max-height:100%;max-width:98%;box-shadow:0 0 12px #000}
#ctrl{display:flex;justify-content:center;gap:12px;padding:8px;align-items:center;flex-wrap:wrap}
#ctrl button{background:#9c1e26;color:#fff;border:2px solid #d4a843;border-radius:8px;padding:10px 26px;font-size:1.05rem;cursor:pointer;font-family:inherit}
#pgno{color:#d4a843;font-weight:bold;font-size:1.1rem}
#jump{width:70px;background:#fff;border:2px solid #d4a843;border-radius:6px;padding:8px;font-size:1rem}
#dl{display:block;text-align:center;margin:12px auto;max-width:440px;background:#1a6e2a;color:#fff;border:3px solid #d4a843;border-radius:12px;padding:14px;font-size:1.1rem;text-decoration:none;font-weight:bold}
.note{max-width:760px;margin:auto;padding:6px;font-size:.85rem;color:#cfd8ee;text-align:center}
</style></head>
<body>
<header><h1>॥ पेंशन योद्धाओं की आवाज़ ॥</h1>
<p class="sub">रिट याचिकाएँ — विभिन्न उच्च न्यायालयों के लिए (501 पेज, हिंदी) · संकलन : बी. एन. अग्रवाल जी, NCPA · हिंदी रूपांतरण : अतुल कपूर, HAL लखनऊ</p></header>
<div id="book"><div style="color:#8fa;padding:20px">किताब लोड हो रही है…</div></div>
<div id="ctrl"><button onclick="flip(-1)">⬅ पिछला</button><span id="pgno"></span><button onclick="flip(1)">अगला ➡</button>
<input type="number" id="jump" placeholder="पेज"><button onclick="go()">जाएँ</button></div>
<a id="dl" href="pension-book-hindi.pdf" download>📕 पूरी 501-पेज PDF डाउनलोड करें</a>
<p class="note">PDF 73 MB की है — पहली बार खुलने में 1–2 मिनट लग सकते हैं।</p>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
let pdf=null,cur=1,total=0;const book=document.getElementById('book');
async function load(){try{pdf=await pdfjsLib.getDocument('pension-book-hindi.pdf').promise;total=pdf.numPages;render();}
catch(e){book.innerHTML='<div style="color:#f88;padding:20px">PDF नहीं मिली।</div>'}}
async function render(){book.innerHTML='';
const pg=await pdf.getPage(cur);
const vp=pg.getViewport({scale:1.5});const c=document.createElement('canvas');
c.width=vp.width;c.height=vp.height;
await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;book.appendChild(c);
document.getElementById('pgno').textContent=cur+' / '+total;}
function flip(d){cur=Math.max(1,Math.min(total,cur+d));render();}
function go(){cur=Math.max(1,Math.min(total,parseInt(document.getElementById('jump').value)||1));render();}
load();
</script>
</body></html>
